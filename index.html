<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>SBI · Mở sổ hàng</title><style>*{box-sizing:border-box}body{margin:0;font:15px/1.7 system-ui,sans-serif;background:#f1f5f2;color:#183d2c;min-height:100vh;display:grid;place-items:center;padding:24px}main{max-width:480px;width:100%;padding:36px;background:white;border:1px solid #dce6df;border-radius:16px;box-shadow:0 12px 45px #153c2510}.brand{font-size:12px;font-weight:750;letter-spacing:2px;color:#087650}h1{font-size:25px;line-height:1.4;margin:18px 0 12px}p{color:#486151}a,button{display:inline-block;background:#087650;color:white;border:0;border-radius:7px;padding:11px 18px;font:inherit;text-decoration:none;cursor:pointer}button{background:#edf4ef;color:#185137;margin-top:10px}small{display:block;margin-top:24px;color:#65796c}#open[hidden]{display:none}</style></head><body><main><div class="brand">SBI · SỔ HÀNG</div><h1>Mở không gian làm việc</h1><p id="status" role="status">Đang lấy địa chỉ web mới nhất…</p><a id="open" hidden rel="noreferrer">Mở sổ hàng</a><button id="retry" type="button">Thử lại</button><small>Đăng nhập bằng tài khoản được cấp. Máy chủ công ty cần đang bật.</small></main><script>
const source='https://raw.githubusercontent.com/nhtiensbi-droid/SBI/main/link.json';
async function load(){const status=document.querySelector('#status'),open=document.querySelector('#open');open.hidden=true;status.textContent='Đang lấy địa chỉ web mới nhất…';try{const response=await fetch(source+'?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(12000)});if(!response.ok)throw Error();const data=await response.json();if(!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com\/?$/.test(data.url||''))throw Error();open.href=data.url;open.hidden=false;status.textContent='Đã tìm thấy địa chỉ mới nhất. Đang mở sổ hàng…';location.replace(data.url)}catch{status.textContent='Chưa lấy được địa chỉ web. Bạn thử lại hoặc liên hệ quản trị để kiểm tra máy chủ.'}}
document.querySelector('#retry').addEventListener('click',load);load();
</script></body></html>
